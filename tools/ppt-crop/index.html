<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习题 PPT · PDF 框选成片</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▤</span>
      <span class="brand-name">习题 PPT<small>PDF 框选一键成片</small></span>
    </div>
    <div class="actions">
      <button class="btn" id="btnAdd" type="button" title="添加 PDF 文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加 PDF
      </button>
      <button class="btn" id="btnExportPdf" type="button" title="导出为 A4 PDF">导出 PDF</button>
      <button class="btn btn-primary" id="btnExportPpt" type="button" title="导出为 16:9 PPTX">导出 PPT</button>
      <button class="btn btn-icon" id="btnSettings" type="button" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.14.35.45.62.82.7H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <section class="pane pdf-pane">
      <div class="pane-head">
        <select id="docSelect" title="选择 PDF 文件"><option value="0">未添加文件</option></select>
        <div class="pager">
          <button class="mini" id="prevPage" type="button" title="上一页">‹</button>
          <span id="pageInfo">— / —</span>
          <button class="mini" id="nextPage" type="button" title="下一页">›</button>
        </div>
        <div class="zoom">
          <button class="mini" id="zoomOut" type="button" title="缩小">−</button>
          <span id="zoomInfo">100%</span>
          <button class="mini" id="zoomIn" type="button" title="放大">＋</button>
          <button class="mini" id="rotate" type="button" title="旋转 90°">↻</button>
        </div>
      </div>
      <div class="pdf-stage" id="pdfStage">
        <canvas id="pdfCanvas"></canvas>
        <div class="select-box" id="selectBox" hidden></div>
        <div class="stage-empty" id="stageEmpty">
          <div class="empty-mark">▤</div>
          <b>把 PDF 拖到这里</b>
          <span>或点击右上角「添加 PDF」</span>
        </div>
        <div class="stage-loading" id="stageLoading" hidden>正在渲染…</div>
      </div>
      <div class="pane-foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h6M4 4v6M20 20h-6M20 20v-6"/><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="2 2"/></svg>
        在 PDF 上按住鼠标拖拽框选题目，松手即生成一张幻灯片
      </div>
    </section>

    <section class="pane slides-pane">
      <div class="pane-head">
        <span class="slides-title">幻灯片 <b id="slideCount">0</b></span>
        <button class="mini" id="btnUndo" type="button" title="撤销上一步">撤销 <span id="undoCount">0</span></button>
        <button class="mini" id="btnAddCover" type="button" title="添加一张封面幻灯片">＋ 封面</button>
        <button class="mini" id="btnPreview" type="button" title="全屏预览">预览</button>
      </div>
      <div class="slide-list" id="slideList">
        <div class="slides-empty" id="slidesEmpty">
          <div class="empty-mark">◫</div>
          <b>还没有幻灯片</b>
          <span>在左边 PDF 上框选题目，就会自动排到这里</span>
        </div>
      </div>
      <div class="pane-foot">拖动卡片可排序 · 每页最多 2 张图片 · 所有处理都在本机浏览器完成</div>
    </section>
  </div>
</div>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-box">
    <div class="modal-head">
      <b>导出设置</b>
      <button class="mini" type="button" data-close="1" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>裁剪清晰度</span>
        <select id="setQuality">
          <option value="1.5">快速（文件小）</option>
          <option value="2" selected>标准（推荐）</option>
          <option value="3">超清</option>
          <option value="4">原画</option>
          <option value="5">极清</option>
        </select>
      </label>
      <label class="field"><span>幻灯片样式</span>
        <select id="setStyle">
          <option value="clean" selected>省墨简洁 · 白底无框</option>
          <option value="card">卡片描边 · 每题带框</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="setSource" checked><span>在图片下方显示来源页码（来源 P3）</span></label>
      <label class="check"><input type="checkbox" id="setCover"><span>在 PPT 第一页添加封面（标题与签名）</span></label>
      <div class="cover-fields" id="coverFields" hidden>
        <label class="field"><span>标题</span><input type="text" id="setTitle" value="习题讲评" maxlength="40"></label>
        <label class="field"><span>签名</span><input type="text" id="setSign" value="" maxlength="30" placeholder="可留空，例如：李老师"></label>
      </div>
      <p class="note">导出在本机完成，图片与文件不会上传到任何服务器。清晰度越高，导出的文件越大、耗时越长。</p>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" type="button" data-close="1">完成</button></div>
  </div>
</div>

<div class="preview" id="previewModal" hidden>
  <div class="preview-bar">
    <span id="previewInfo">— / —</span>
    <button class="mini" id="prevSlide" type="button">‹ 上一页</button>
    <button class="mini" id="nextSlide" type="button">下一页 ›</button>
    <button class="mini" id="closePreview" type="button">✕ 关闭</button>
  </div>
  <div class="preview-stage" id="previewStage"></div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept="application/pdf" multiple hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pptxgen.bundle.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
